name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile source
        run: python -m py_compile file_integrity_monitor.py tests/test_file_integrity_monitor.py

      - name: Run tests with warnings treated as errors
        run: python -W error -m unittest discover -s tests -v
